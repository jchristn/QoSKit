name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly endurance run (03:17 UTC).
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore QoSKit.slnx

      - name: Build
        run: dotnet build QoSKit.slnx --configuration Release --no-restore

      - name: Run console tests
        run: dotnet run --project src/Test.Automated --configuration Release --framework net10.0 -- --results results.json

      - name: Run xUnit tests
        run: dotnet test src/Test.Xunit --configuration Release

      - name: Run NUnit tests
        run: dotnet test src/Test.Nunit --configuration Release

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.json

  endurance:
    # Long-form soak; runs on the nightly schedule only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      QOSKIT_SOAK_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build QoSKit.slnx --configuration Release

      - name: Run endurance soak
        run: dotnet run --project src/Test.Automated --configuration Release --framework net10.0
